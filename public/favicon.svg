<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
  </defs>
  <!-- Background tile -->
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>
  <!-- Bold G letterform via text — crisp at all sizes -->
  <text
    x="52" y="71"
    font-family="'Arial Black','Helvetica Neue',Helvetica,Arial,sans-serif"
    font-size="66" font-weight="900"
    text-anchor="middle"
    fill="white"
  >G</text>
  <!-- Gold accent bar under the G -->
  <rect x="27" y="79" width="46" height="5" rx="2.5" fill="#f59e0b"/>
</svg>
